<!doctype html>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>harness · watching</title>
<style><!-- include shared.css --></style>

<header>
  <span id="mark"><svg id="glider" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"></svg></span>
  <h1>harness</h1>
  <span class="meta" id="who"></span>
  <span class="pill" id="status">connecting</span>
  <span class="meta" id="counts"></span>
  <span class="grow"></span>
  <a class="meta" href="/watch">watch &rarr;</a>
</header>

<main><div id="log"></div></main>

<div id="dock">
  <div id="bar">
    <span id="spin">·</span>
    <span id="state">watching</span>
    <span id="elapsed"></span>
    <span id="idle"></span>
    <span class="grow"></span>
    <span id="ctx"></span>
  </div>
</div>

<div id="shade"></div>
<aside id="detail">
  <div class="top">
    <span class="name" id="dname"></span>
    <span class="meta" id="dmark"></span>
    <span class="grow"></span>
    <button id="dclose">close</button>
  </div>
  <div class="body">
    <section><h3>arguments</h3><pre id="dargs"></pre></section>
    <section><h3>result</h3><pre id="dresult"></pre></section>
  </div>
</aside>

<script><!-- include shared.js --></script>
<script>
// Watching one thread, read-only. `/console` drives runs; this only reads a transcript as
// it is written, which is why it works for an eval in another process entirely -- the case
// it was built for. Everything it shares with the console is in shared.js.
const thread = location.pathname.split("/").filter(Boolean).pop();
const answered = new Map();
let turns = 0, calls = 0, frame = 0;
let startedAt = null, lastRow = 0, finished = false, finishedAt = null, liveFinish = false;
const connectedAt = Date.now();

function paintClock() {
  document.body.classList.toggle("done", finished);
  $("state").textContent = finished ? "done" : "watching";
  const elapsed = $("elapsed"), idle = $("idle");
  if (finished) {
    $("spin").textContent = "✓";
    // Only claimed when this page watched the run end. Transcript rows carry no timestamps,
    // so a run already finished when the page opened has no honest duration to print.
    elapsed.textContent = liveFinish && startedAt ? human(finishedAt - startedAt) : "";
    idle.textContent = "";
    return;
  }
  elapsed.textContent = startedAt ? human(Date.now() - startedAt) : "";
  const quiet = Date.now() - lastRow;
  idle.textContent = lastRow && quiet > 15000 ? `· idle ${human(quiet)}` : "";
}

function draw(message) {
  const stick = near();
  const log = $("log");
  if (message.role === "compaction") {
    log.appendChild(el("compact", "context compacted — the transcript still holds every turn"));
    const note = el("say"); note.textContent = (message.content || "").slice(0, 600);
    log.lastChild.appendChild(note);
  } else if (message.role === "user") {
    // A task is an authored document -- backticked flags, bullets, sometimes a table of
    // cases -- and showing it raw made the one message that defines the run the only one
    // on the page not rendered. `.md p` keeps `pre-wrap`, so the line breaks a task relies
    // on survive the change.
    const block = el("turn");
    block.appendChild(el("n", "asked"));
    block.appendChild(markdown(message.content || ""));
    log.appendChild(block);
  } else if (message.role === "arrival") {
    // Shown with its framing intact. This page exists to show what the model was actually
    // told, and the framing is the part that says who the text is really from.
    //
    // A person's words render as the document they are. A watch's do not: those lines are
    // machine output, and a log line beginning with `#` is not a heading -- rendering it as
    // one would be this page inventing structure the process never wrote. `source` is on
    // the message for exactly this kind of decision; absent on older transcripts, which
    // fall back to verbatim.
    const block = el("turn arrived");
    block.appendChild(el("n", "arrived mid-run"));
    block.appendChild(message.source === "person"
      ? markdown(message.content || "")
      : el("say", message.content || ""));
    log.appendChild(block);
  } else if (message.role === "assistant") {
    turns++;
    const block = el("turn");
    block.appendChild(el("n", `turn ${turns}`));
    if ((message.content || "").trim()) block.appendChild(markdown(message.content));
    for (const call of message.tool_calls || []) {
      calls++;
      const line = el("tool active");
      line.appendChild(el("mark", "◐"));
      const name = el("name"); name.textContent = call.name;
      const arg = el("arg"); arg.textContent = JSON.stringify(call.arguments || {}).slice(1, -1);
      line.append(name, arg);
      line._call = call;
      line.onclick = () => showTool(line);
      block.appendChild(line);
      answered.set(call.call_id, line);
    }
    log.appendChild(block);
  } else if (message.role === "tool") {
    const line = answered.get(message.call_id);
    const body = (message.content || "").trim();
    const bad = /^(?:[a-z_]+ failed:|invalid arguments|no tool named)/.test(body)
             || /refus|not allowed|outside/i.test(body.slice(0, 90));
    if (line) {
      line.className = "tool " + (bad ? "failed" : "completed");
      line.firstChild.textContent = bad ? "✗" : "✓";
      const first = body.split("\n")[0].slice(0, 120);
      line.lastChild.textContent += first ? "  → " + first : "";
      line._result = message.content || "";
      line._bad = bad;
      answered.delete(message.call_id);
    }
  }
  $("counts").textContent = turns ? `${turns} turns · ${calls} calls` : "";
  if (stick) { const box = scroller(); box.scrollTop = box.scrollHeight; }
}

function record(message) {
  messages.push(message);
  lastRow = Date.now();
  const was = finished;
  // A reply with no tool calls is how a run ends -- `loop.py` stops the turn there.
  if (message.role === "assistant") finished = !(message.tool_calls || []).length;
  else if (message.role === "user" || message.role === "tool") finished = false;
  if (finished && !was) { finishedAt = Date.now(); liveFinish = Date.now() - connectedAt > 3000; }
  if (!finished) finishedAt = null;
  draw(message);
  paintContext();
  paintClock();
}

const shut = () => {
  $("shade").classList.remove("on"); $("detail").classList.remove("on");
};
$("shade").onclick = shut;
$("dclose").onclick = shut;
document.onkeydown = (event) => { if (event.key === "Escape") shut(); };

const source = new EventSource(withToken(`/api/v1/watch/${thread}/events`));
source.onopen = () => $("status").textContent = "watching";
source.onerror = () => $("status").textContent = "waiting for the run…";
source.onmessage = (event) => {
  let row; try { row = JSON.parse(event.data); } catch (e) { return; }
  if (row.kind === "harness") {
    if (row.context_window) ctxWindow = row.context_window;
    if (row.compact_at) compactAt = row.compact_at;
    paintContext();
    return;
  }
  if (row.kind === "thread") {
    $("status").textContent = "watching";
    $("who").textContent = (row.workspace || "").split("/").filter(Boolean).pop() || thread;
    $("who").title = row.workspace || "";
    document.title = `harness · ${$("who").textContent}`;
    startedAt = Date.parse(row.created_at || "") || Date.now();
    paintClock();
    return;
  }
  record(row);
};

setInterval(() => {
  if (!finished) $("spin").textContent = FRAMES[frame++ % FRAMES.length];
}, 90);
setInterval(paintClock, 1000);

</script>
