<!doctype html>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>harness · console</title>
<style><!-- include shared.css --></style>

<header>
  <button id="burger" title="threads" aria-label="threads">
    <svg id="glider" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"></svg>
  </button>
  <h1>harness</h1>
  <span class="meta" id="who">no thread</span>
  <span class="pill" id="status">idle</span>
  <span class="meta" id="counts"></span>
  <span class="grow"></span>
  <select id="mode" title="mode"><option value="normal">normal</option><option value="plan">plan</option></select>
  <select id="policy" title="approvals">
    <option value="ask">ask first</option>
    <option value="full-access">full access</option>
  </select>
  <a class="meta" href="/watch" title="everything there is to watch">watch &rarr;</a>
</header>

<main><div id="log"></div></main>

<div id="dock">
  <div id="ask"></div>
  <div id="composer">
    <textarea id="say" rows="1" placeholder="Say something to the agent…  (enter sends, shift+enter for a newline)"></textarea>
    <button id="send" class="primary">send</button>
    <button id="stop" class="danger" hidden>stop</button>
  </div>
  <div id="bar">
    <span id="spin">·</span>
    <span id="state">idle</span>
    <span id="elapsed"></span>
    <span id="doing"></span>
    <span class="grow"></span>
    <span id="ctx"></span>
  </div>
</div>

<div id="shade"></div>
<nav id="drawer">
  <div class="top"><h2 class="grow">threads</h2><button id="new">new thread</button></div>
  <div id="threads"></div>
</nav>

<aside id="detail">
  <div class="top">
    <span class="name" id="dname"></span>
    <span class="meta" id="dmark"></span>
    <span class="grow"></span>
    <button id="dclose">close</button>
  </div>
  <div class="body">
    <section><h3>arguments</h3><pre id="dargs"></pre></section>
    <section><h3>result</h3><pre id="dresult"></pre></section>
  </div>
</aside>

<div id="picker">
  <div class="top"><strong>pick a folder</strong><span class="grow"></span><span class="meta" id="vcs"></span></div>
  <div class="top">
    <button id="up">↑</button>
    <span class="meta" id="here"></span>
    <button id="mkdir">new folder</button>
  </div>
  <div id="newrow" hidden>
    <input id="newname" placeholder="folder name" autocomplete="off" spellcheck="false">
    <button id="mkgo" class="primary">create</button>
  </div>
  <div id="dirs"></div>
  <div class="bottom">
    <span class="warn grow" id="pickerr"></span>
    <button id="cancelpick">cancel</button>
    <button id="usehere" class="primary">start a thread here</button>
  </div>
</div>

<script><!-- include shared.js --></script>
<script>
// ---------------------------------------------------------------------------- plumbing
async function api(path, options) {
  const response = await fetch(withToken(`/api/v1${path}`), {
    headers: { "content-type": "application/json" }, ...options,
  });
  const body = await response.json().catch(() => ({}));
  // Every failure this server produces has a name and a sentence in it; showing the
  // sentence is the whole reason it goes to that trouble.
  if (!response.ok) throw new Error(body?.detail?.message || `${response.status}`);
  return body;
}

// ---------------------------------------------------------------------------- state

let threadId = "", runId = "", workspaceId = "";
let history = null, live = null;               // the two EventSources
let answered = new Map(), turns = 0, calls = 0;
let startedAt = null, lastRow = 0, running = false, frame = 0;
let pickAt = "", pickVcs = "none";

// ---------------------------------------------------------------------------- the log
// Rendering the stored transcript, exactly as watch.html does: the run's event stream is
// per-call and live, but it only covers ONE run, and a thread you have just switched to has
// a history that only the transcript holds. So the transcript draws the conversation and the
// run stream is kept for the things it alone can do -- approvals, questions, live activity.
function draw(message) {
  const stick = near();
  const log = $("log");

  if (message.role === "compaction") {
    log.appendChild(el("compact", "context compacted — the transcript still holds every turn"));
    const note = el("say"); note.textContent = (message.content || "").slice(0, 600);
    log.lastChild.appendChild(note);
  } else if (message.role === "user") {
    const block = el("turn");
    block.appendChild(el("n", "you"));
    block.appendChild(el("say", message.content || ""));
    log.appendChild(block);
  } else if (message.role === "arrival") {
    // Shown with its framing intact. This page exists to show what the model was actually
    // told, and the framing is the part that says who the text is really from.
    const block = el("turn arrived");
    block.appendChild(el("n", "arrived mid-run"));
    block.appendChild(el("say", message.content || ""));
    log.appendChild(block);
  } else if (message.role === "assistant") {
    turns++;
    const block = el("turn");
    block.appendChild(el("n", `turn ${turns}`));
    // The model's prose is markdown; what you typed is shown as you typed it.
    if ((message.content || "").trim()) block.appendChild(markdown(message.content));
    for (const call of message.tool_calls || []) {
      calls++;
      const line = el("tool active");
      line.appendChild(el("mark", "◐"));
      const name = el("name"); name.textContent = call.name;
      const arg = el("arg"); arg.textContent = JSON.stringify(call.arguments || {}).slice(1, -1);
      line.append(name, arg);
      line._call = call;
      line.onclick = () => showTool(line);
      block.appendChild(line);
      answered.set(call.call_id, line);
    }
    log.appendChild(block);
  } else if (message.role === "tool") {
    const line = answered.get(message.call_id);
    const body = (message.content || "").trim();
    const bad = /^(?:[a-z_]+ failed:|invalid arguments|no tool named)/.test(body)
             || /refus|not allowed|outside/i.test(body.slice(0, 90));
    if (line) {
      line.className = "tool " + (bad ? "failed" : "completed");
      line.firstChild.textContent = bad ? "✗" : "✓";
      const first = body.split("\n")[0].slice(0, 120);
      line.lastChild.textContent += first ? "  → " + first : "";
      // The whole thing, kept on the row for the pull-out. This is what the model read --
      // the loop already cut it to `Output.per_result` before it was stored, so showing it
      // whole shows exactly what the model was given and not a second truncation of it.
      line._result = message.content || "";
      line._bad = bad;
      answered.delete(message.call_id);
    }
  }
  $("counts").textContent = turns ? `${turns} turns · ${calls} calls` : "";
  if (stick) { const box = scroller(); box.scrollTop = box.scrollHeight; }
}

// ---------------------------------------------------------------------------- the meter
function paintClock() {
  document.body.classList.toggle("done", !running);
  $("state").textContent = running ? "working" : (threadId ? "idle" : "no thread");
  $("elapsed").textContent = running && startedAt ? human(Date.now() - startedAt) : "";
  if (!running) { $("spin").textContent = "·"; $("doing").textContent = ""; }
}

// ---------------------------------------------------------------------------- threads
function reset() {
  if (history) history.close();
  if (live) live.close();
  history = live = null;
  messages.length = 0; answered = new Map(); turns = 0; calls = 0;
  runId = ""; running = false; startedAt = null; workspaceId = "";
  $("log").textContent = ""; $("ask").textContent = "";
  $("counts").textContent = ""; $("ctx").textContent = "";
  paintClock();
}

// The folder, not the first thing that was asked. A question is any length and wraps the
// header onto a second row as it grows; a folder name is short, and it is also the thing
// that actually distinguishes one thread from another when you are looking for your place.
function setWho(name, path) {
  $("who").textContent = name;
  $("who").title = path || "";
  document.title = `harness · ${name}`;
}

// Which folder this thread belongs to, and therefore which workspace a run must be started
// against. Not merely cosmetic: `workspaceId` was left over from whichever thread was open
// before, and `create_run` answers a mismatched one with a 409.
async function describe(id) {
  try {
    const info = await api(`/threads/${id}`);
    if (id !== threadId) return;                    // switched while we were asking
    workspaceId = info.workspace_id || "";
    const known = await api("/workspaces");
    if (id !== threadId) return;
    const folder = known.find((w) => w.workspace_id === workspaceId);
    if (folder) {
      setWho(folder.name || folder.root_path.split("/").filter(Boolean).pop() || id, folder.root_path);
    }
  } catch (e) { /* a thread with no folder still reads fine */ }
}

function openThread(id, folder) {
  reset();
  threadId = id;
  localStorage.setItem("harness.thread", id);
  setWho(folder || "opening…", "");
  $("status").textContent = "reading";
  describe(id);
  history = new EventSource(withToken(`/api/v1/watch/${id}/events`));
  history.onopen = () => $("status").textContent = "connected";
  history.onerror = () => $("status").textContent = "no transcript yet";
  history.onmessage = (frame) => {
    let row; try { row = JSON.parse(frame.data); } catch (e) { return; }
    if (row.kind === "harness") {
      if (row.context_window) ctxWindow = row.context_window;
      if (row.compact_at) compactAt = row.compact_at;
      paintContext();
      return;
    }
    if (row.kind === "thread") { $("status").textContent = "connected"; return; }
    messages.push(row); lastRow = Date.now();
    draw(row); paintContext();
  };
  refreshThreads();
  reattach();
}

async function refreshThreads() {
  let rows = [];
  try { rows = (await api("/threads?limit=60")).threads || []; } catch (e) {}
  const box = $("threads");
  box.textContent = "";
  if (!rows.length) {
    box.appendChild(el("meta", "no threads yet — start one with “new thread”."));
    return;
  }

  // Grouped by folder, in the order the server listed them -- which is newest first, so the
  // project worked on most recently is the one at the top. A flat column of questions stops
  // being scannable at about a screenful, and every one of them says "analyze this repo".
  const projects = new Map();
  for (const row of rows) {
    const key = row.folder || "elsewhere";
    if (!projects.has(key)) projects.set(key, []);
    projects.get(key).push(row);
  }

  for (const [folder, group] of projects) {
    const heading = el("project", folder);
    heading.title = group[0].root_path || "";
    box.appendChild(heading);
    for (const row of group) {
      const item = document.createElement("button");
      item.className = "thread" + (row.thread_id === threadId ? " on" : "");
      item.textContent = row.title || "(untitled)";
      item.title = row.thread_id;          // the id, for when you actually want it
      if (row.latest_run_status) item.appendChild(el("who", row.latest_run_status));
      item.onclick = () => { openThread(row.thread_id); shut(); toComposer(); };
      box.appendChild(item);
    }
  }
}

// ---------------------------------------------------------------------------- sending
// When a run started here, remember when. A reload can find the run again -- `GET /runs`
// reports it and the event log replays from seq 0 -- but nothing on the wire carries a
// start time, so the only honest source for the elapsed clock is the browser that watched
// it begin. A run picked up from some other page shows no clock rather than a wrong one.
function runStart(id, begin) {
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem("harness.runs") || "{}"); } catch (e) {}
  if (begin) {
    seen[id] = Date.now();
    const keys = Object.keys(seen);
    for (const old of keys.slice(0, Math.max(0, keys.length - 20))) delete seen[old];
    try { localStorage.setItem("harness.runs", JSON.stringify(seen)); } catch (e) {}
  }
  return seen[id] || null;
}

const OVER = ["completed", "failed", "cancelled", "blocked"];

// A reload while the agent is working must not strand it. The run keeps going regardless --
// it lives in the server, not the page -- but an approval it is parked on is delivered to
// whoever is listening, and a page that never reattaches leaves it waiting forever. The
// replay from seq 0 re-offers anything still pending, and re-delivers the resolutions of
// everything already answered, which cancel themselves out.
async function reattach() {
  const mine = threadId;
  let rows = [];
  try { rows = (await api(`/runs?thread_id=${mine}`)).runs || []; } catch (e) { return; }
  if (mine !== threadId) return;          // switched threads while we were asking
  const alive = rows.find((r) => !OVER.includes(r.status));
  if (alive) follow(alive.run_id, true);
}

// While a run is going, what you type is added to it rather than starting another. The
// words land at the next turn boundary, so there is a delay bounded by one model call and
// its tools -- which is why this says so rather than pretending it was instant.
async function steer(text) {
  try {
    await api(`/runs/${runId}/commands`, {
      method: "POST",
      body: JSON.stringify({ command_id: crypto.randomUUID(), type: "steer", content: text }),
    });
    $("doing").textContent = "· queued for the next turn";
  } catch (e) {
    $("say").value = text;
    $("ask").appendChild(problem(e.message));
  }
}

async function send() {
  const box = $("say");
  const text = box.value.trim();
  if (!text) return;
  if (!threadId) { open_(); pick(); return; }

  box.value = ""; box.style.height = "auto";
  if (running) return steer(text);
  try {
    const started = await api(`/threads/${threadId}/runs`, {
      method: "POST",
      headers: { "content-type": "application/json", "idempotency-key": crypto.randomUUID() },
      body: JSON.stringify({
        message: { content: text },
        mode: $("mode").value,
        approval_policy: $("policy").value,
        ...(workspaceId ? { workspace_id: workspaceId } : {}),
      }),
    });
    follow(started.run_id);
  } catch (e) {
    box.value = text;             // never swallow what someone typed
    $("ask").appendChild(problem(e.message));
  }
}

function problem(text) {
  const panel = el("ask");
  const row = el("head"); row.appendChild(el("title warn", "could not start that run"));
  panel.append(row, el("why", text));
  const buttons = el("row");
  const ok = document.createElement("button");
  ok.textContent = "dismiss"; ok.onclick = () => panel.remove();
  buttons.appendChild(ok); panel.appendChild(buttons);
  return panel;
}

// The run's own stream. Not for drawing the conversation -- the transcript does that -- but
// for the three things only this carries: what the agent is doing right now, what it needs
// permission for, and what it is asking.
function follow(id, resumed) {
  runId = id; running = true;
  startedAt = runStart(id, !resumed);
  $("stop").hidden = false;
  $("say").placeholder = "Add to what it is doing…  (delivered at the next turn)";
  $("status").textContent = "running";
  paintClock();

  live = new EventSource(withToken(`/api/v1/runs/${id}/events?after_seq=0`));
  live.addEventListener("stream.end", () => finish());
  live.onerror = () => { $("status").textContent = "stream lost"; };
  live.onmessage = (frame) => {
    let row; try { row = JSON.parse(frame.data); } catch (e) { return; }
    const load = row.payload || {};
    if (row.type === "run.progress") {
      $("doing").textContent = load.status === "active" ? `· ${load.text || ""}`.slice(0, 90) : "";
    } else if (row.type === "approval.requested") {
      askApproval(load);
    } else if (row.type === "question.requested") {
      askQuestion(load);
    } else if (row.type === "approval.resolved" || row.type === "question.resolved") {
      const open = $("ask").querySelector(`[data-id="${load.approval_id || load.question_id}"]`);
      if (open) open.remove();
    } else if (row.type === "run.paused") {
      $("status").textContent = "paused";
    } else if (["run.completed", "run.failed", "run.cancelled", "run.blocked"].includes(row.type)) {
      $("status").textContent = row.type.split(".")[1];
      finish();
    }
  };
}

function finish() {
  running = false;
  if (live) { live.close(); live = null; }
  $("stop").hidden = true;
  $("say").placeholder = "Say something to the agent…  (enter sends, shift+enter for a newline)";
  $("ask").textContent = "";
  paintClock();
  refreshThreads();
}

async function command(body) {
  try { await api(`/runs/${runId}/commands`, {
    method: "POST",
    body: JSON.stringify({ command_id: crypto.randomUUID(), ...body }),
  }); } catch (e) { $("ask").appendChild(problem(e.message)); }
}

// `approve_bash_always` is offered for every tool but `exit_plan_mode`, not just the shell,
// and its grant key is the PROGRAM for `run` and the tool name for everything else. So the
// label follows the case: "this program" is a lie on a file write.
const label = (decision, shell) =>
  decision === "approve" ? "approve"
  : decision === "reject" ? "reject"
  : decision === "approve_bash_always" ? (shell ? "always allow this program" : "always allow")
  : decision;

function askApproval(load) {
  const panel = el("ask" + (load.risk === "high" ? " high" : ""));
  panel.dataset.id = load.approval_id;
  const head = el("head");
  head.appendChild(el("title", load.title || "may I?"));
  head.appendChild(el("meta", load.risk === "high" ? "not sandboxed" : ""));
  panel.appendChild(head);
  if (load.summary) panel.appendChild(el("why", load.summary));
  const argv = (load.arguments || {}).argv;
  if (argv) panel.appendChild(el("why", argv.join(" ")));

  const row = el("row");
  for (const decision of load.allowed_decisions || ["approve", "reject"]) {
    const button = document.createElement("button");
    button.textContent = label(decision, load.risk === "high");
    if (decision === "approve") button.className = "primary";
    if (decision === "reject") button.className = "danger";
    button.onclick = () => {
      panel.remove();
      command({ type: "resolve_approval", approval_id: load.approval_id, decision });
    };
    row.appendChild(button);
  }
  panel.appendChild(row);
  $("ask").appendChild(panel);
}

function askQuestion(load) {
  const panel = el("ask");
  panel.dataset.id = load.question_id;
  panel.appendChild(el("head", "")).appendChild(el("title", "the agent is asking"));
  panel.appendChild(el("why", load.prompt || ""));
  const row = el("row");
  const reply = (content) => {
    panel.remove();
    command({ type: "answer", question_id: load.question_id, content });
  };
  for (const option of load.options || []) {
    const button = document.createElement("button");
    button.textContent = option;
    button.onclick = () => reply(option);
    row.appendChild(button);
  }
  const field = document.createElement("textarea");
  field.rows = 1; field.id = "answer"; field.placeholder = "…or answer in your own words";
  field.style.cssText = "flex:1;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:6px;padding:.3rem .5rem";
  field.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); reply(field.value); } };
  row.appendChild(field);
  panel.appendChild(row);
  $("ask").appendChild(panel);
  field.focus();
}

// ---------------------------------------------------------------------------- picker
// After a click the button keeps focus, and a focused button treats Enter as a click -- so
// picking a thread and then typing sent the next Enter back to the thread list. Blurring is
// the fix; focusing the composer is the courtesy, withheld on a touch screen where it would
// throw up the keyboard over a page nobody has asked to type into yet.
function toComposer() {
  document.activeElement?.blur();
  if (!window.matchMedia("(pointer: coarse)").matches) $("say").focus();
}

const open_ = () => { $("drawer").classList.add("on"); $("shade").classList.add("on"); };
const shut = () => {
  $("drawer").classList.remove("on"); $("shade").classList.remove("on");
  $("picker").classList.remove("on"); $("detail").classList.remove("on");
};

async function pick(path) {
  $("pickerr").textContent = "";
  let listing;
  try { listing = await api(`/folders${path ? `?path=${encodeURIComponent(path)}` : ""}`); }
  catch (e) { $("pickerr").textContent = e.message; return; }
  pickAt = listing.path; pickVcs = listing.vcs;
  $("newrow").hidden = true;
  $("picker").classList.add("on"); $("shade").classList.add("on");
  $("here").textContent = listing.path;
  $("vcs").textContent = listing.vcs === "git" ? "git repository" : "";
  $("up").disabled = !listing.parent;
  $("up").onclick = () => pick(listing.parent);
  const box = $("dirs");
  box.textContent = "";
  if (!listing.entries.length) box.appendChild(el("meta", "no folders in here"));
  for (const entry of listing.entries) {
    const item = document.createElement("button");
    item.className = "dir";
    item.textContent = entry.name + "/";
    item.onclick = () => pick(entry.path);
    box.appendChild(item);
  }
}

// Made where you are standing, then stepped into -- which is what you wanted the folder for.
async function makeFolder() {
  const name = $("newname").value.trim();
  if (!name) return;
  $("pickerr").textContent = "";
  try {
    const made = await api("/folders", {
      method: "POST", body: JSON.stringify({ path: pickAt, name }),
    });
    $("newrow").hidden = true;
    $("newname").value = "";
    pick(made.path);
  } catch (e) {
    $("pickerr").textContent = e.message;
  }
}

async function startHere() {
  $("pickerr").textContent = "";
  try {
    let record;
    try {
      record = await api("/workspaces", {
        method: "POST",
        body: JSON.stringify({
          root_path: pickAt, name: pickAt.split("/").filter(Boolean).pop() || pickAt, vcs: pickVcs,
        }),
      });
    } catch (e) {
      // Already registered is not a failure: find the one that exists and use it. Passing
      // replace_existing instead would rewrite a registration on every visit.
      const known = await api("/workspaces");
      record = known.find((w) => w.root_path === pickAt);
      if (!record) throw e;
    }
    workspaceId = record.workspace_id;
    const made = await api("/threads", {
      method: "POST", body: JSON.stringify({ workspace_id: workspaceId }),
    });
    shut();
    openThread(made.thread_id, record.name);
    toComposer();
  } catch (e) {
    $("pickerr").textContent = e.message;
  }
}

// ---------------------------------------------------------------------------- wiring
$("burger").onclick = () => ($("drawer").classList.contains("on") ? shut() : open_());
$("shade").onclick = shut;
$("new").onclick = () => pick(localStorage.getItem("harness.folder") || "");
$("cancelpick").onclick = shut;
$("mkdir").onclick = () => {
  const row = $("newrow");
  row.hidden = !row.hidden;
  if (!row.hidden) $("newname").focus();
};
$("mkgo").onclick = makeFolder;
$("newname").onkeydown = (event) => {
  if (event.key === "Enter") { event.preventDefault(); makeFolder(); }
  if (event.key === "Escape") { $("newrow").hidden = true; }
};
$("dclose").onclick = shut;
$("usehere").onclick = () => { localStorage.setItem("harness.folder", pickAt); startHere(); };
$("send").onclick = send;
$("stop").onclick = () => command({ type: "cancel" });
$("say").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
$("say").oninput = (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 192) + "px";
};
document.onkeydown = (e) => { if (e.key === "Escape") shut(); };



setInterval(() => {
  if (running) $("spin").textContent = FRAMES[frame++ % FRAMES.length];
}, 90);
setInterval(paintClock, 1000);

(async () => {
  await refreshThreads();
  const last = localStorage.getItem("harness.thread");
  if (last) {
    try { await api(`/threads/${last}`); openThread(last); return; }
    catch (e) { localStorage.removeItem("harness.thread"); }
  }
  paintClock();
  open_();
})();
</script>
