[project]
name = "harness"
version = "0.0.1"
description = "A small coding-agent harness: one loop, real tools, an OS sandbox"
readme = "README.md"
# Matching the interpreter the predecessor settled on: 3.14 is installed on this Mac but
# several dependencies still lag it.
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",   # OpenAI-compatible provider client
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
