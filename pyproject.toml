[project]
name = "harness"
version = "0.0.1"
description = "A small coding-agent harness: one loop, real tools, approval before anything changes"
readme = "README.md"
# Matching the interpreter the predecessor settled on: 3.14 is installed on this Mac but
# several dependencies still lag it.
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",       # provider client
    # Tool-argument validation. `fastjsonschema` is ~100x faster and gets there by
    # generating and exec'ing Python from the schema -- which, once tool schemas can come
    # from anywhere but this repository, means running code derived from untrusted input
    # inside the component whose job is to withhold permission. The speed argument does not
    # apply either: one validation per tool call, against a model round-trip measured in
    # seconds.
    "jsonschema>=4.23",
    # The server front end. Starlette is routing, a request object and a streaming
    # response -- which is the whole of what an SSE endpoint needs, and it leaves the three
    # things that actually hang a client (the `event:` line, closing after it, the idle
    # comment) written out where they can be read. A framework that generated the stream
    # would hide exactly those three.
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
harness = "harness.cli:main"
harness-serve = "harness.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
