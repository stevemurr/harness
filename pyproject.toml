[project]
name = "harness"
version = "0.0.1"
description = "A small coding-agent harness: one loop, real tools, approval before anything changes"
readme = "README.md"
# Matching the interpreter the predecessor settled on: 3.14 is installed on this Mac but
# several dependencies still lag it.
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",       # provider client
    # Tool-argument validation. `fastjsonschema` is ~100x faster and gets there by
    # generating and exec'ing Python from the schema -- which, once tool schemas can come
    # from anywhere but this repository, means running code derived from untrusted input
    # inside the component whose job is to withhold permission. The speed argument does not
    # apply either: one validation per tool call, against a model round-trip measured in
    # seconds.
    "jsonschema>=4.23",
    # The server front end. Starlette is routing, a request object and a streaming
    # response -- which is the whole of what an SSE endpoint needs, and it leaves the three
    # things that actually hang a client (the `event:` line, closing after it, the idle
    # comment) written out where they can be read. A framework that generated the stream
    # would hide exactly those three.
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The browser is not a Python dependency: `open_url`, `web_search` and `screenshot` go
# through `wkrender`, a Swift command in the repository beside this one, installed by
# `harness install-webkit`. Playwright's Chromium was the browser until 2026-09-03.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "basedpyright>=1.29",
    # `jsonschema` ships no inline types, and the one place it is used is the boundary
    # where a model's arguments are validated -- the last place worth checking blind.
    "types-jsonschema",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# So `import evals` works: the runner is a package at the repository root, not in `src`.
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
# The package only. Tests and eval seeds are deliberately outside: a fixture that builds a
# deliberately wrong call is the point of the test, and a rung's seed is written to be
# broken.
files = ["src/harness"]
python_version = "3.12"
# Not strict, and not yet. The first run found fifteen errors in six files, including a
# `None` dereference on a live path and three Protocols whose implementations do not
# satisfy them. Those are worth fixing before the bar is raised; a checker that starts red
# and stays red teaches people to ignore it.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# Eval seeds are fixtures the agent is asked to work on, not this project's code. They are
# written to be a starting point rather than to satisfy a linter.
extend-exclude = ["evals/long/*/seed", "evals/ladder/*/seed", "evals/long/*/reference", "evals/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ISC"]
# Explicit `+` between the pieces of a long string, never adjacency: basedpyright's
# `reportImplicitStringConcatenation` is on, and ruff's ISC003 would ask for the opposite.
ignore = ["ISC003"]

[tool.basedpyright]
# The package only, like mypy above, and for the same reason. "recommended" is the based
# ruleset: `Any` is reported, overrides must say so, and an unused parameter is a question.
include = ["src/harness", "evals"]
# Seeds and reference solutions are fixtures the agent is asked to work on, written to be
# broken or to be solved; checking them would be checking the question.
exclude = ["evals/ladder", "evals/long", "evals/results", "evals/fixtures", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
